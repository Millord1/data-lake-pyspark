[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lake-pyspark"
version = "0.1.0"
description = "Data Lake pipeline for mobility and weather data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "confluent-kafka==2.5.0",
    "duckdb>=0.10.0",
    "kagglehub==1.0.2",
    "minio>=7.2.0",
    "pymongo==4.17.0",
    "python-dotenv==1.2.3",
    "requests==2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"