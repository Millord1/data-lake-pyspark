[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake-pyspark"
version = "0.1.0"
description = "Pipeline Data Engineer Vélib & Météo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2.0",
    "python-dotenv>=1.0.1",
    "duckdb>=0.10",
    "pymongo>=4.6.0,<5.0.0",
    "ruff==0.6.1",
    "kagglehub==1.0.2",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "confluent-kafka==2.5.0",
    "pyspark==3.5.1",
    "apache-airflow==2.10.5",
]

[tool.ruff]
# Longueur de ligne max (alignée avec Black en général)
line-length = 88
target-version = "py311"

# Dossiers à ignorer
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Règles activées
# E/W = pycodestyle, F = Pyflakes, I = isort (tri des imports), B = flake8-bugbear
select = ["E", "W", "F", "B"]

# Règles spécifiques à ignorer si besoin
ignore = []

# Autoriser la suppression automatique des imports inutilisés
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Configuration spécifique du tri d'imports
combine-as-imports = false