[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake-pyspark"
version = "0.1.0"
description = "Pipeline Data Engineer Vélib & Météo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2.0",
    "python-dotenv>=1.0.1",
    "duckdb>=0.10",
    "pymongo>=4.6.0,<5.0.0",
    "ruff==0.6.1",
    "kagglehub==1.0.2",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "confluent-kafka==2.5.0",
    "pyspark==3.5.1",
]