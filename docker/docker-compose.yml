services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distant_doc_app
    command: ["sh", "-c", "exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - minio-network
      - mongo-network

  minio:
    image: minio/minio:latest
    container_name: distant_doc_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minio-network

  mongodb:
    image: mongo:8.0.4
    container_name: distant_doc_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mongo-network

networks:
  minio-network:
    driver: bridge

  mongo-network:
    driver: bridge

volumes:
  minio-data:
  mongo-data: