services:

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: distant_spark_app
    ports:
      - "8000:8000"
    env_file:
      - ../.env.docker
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - minio-network
      - mongo-network

  minio:
    image: minio/minio:latest
    container_name: distant_spark_minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"

    env_file:
      - ../.env.docker
    volumes:
      - ${HOME}/minio/data_compose:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minio-network

  mongodb:
    image: mongo:8
    command: mongod --logpath /dev/null
    container_name: distant_spark_mongodb
    ports:
      - "27017:27017"
    env_file:
          - ../.env.docker
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mongo-network

  spark-master:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    container_name: distant_doc_spark_master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    networks:
      - minio-network

  spark-worker:
    build:
      context: ..
      dockerfile: docker/spark/Dockerfile
    container_name: distant_doc_spark_worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    ports:
      - "8081:8081"
    networks:
      - minio-network

networks:

  minio-network:
    driver: bridge

  mongo-network:
    driver: bridge

volumes:

  mongo-data: